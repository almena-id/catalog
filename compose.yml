name: almena-catalog

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_CATALOG_WEB_URL: ${NEXT_PUBLIC_CATALOG_WEB_URL:-https://catalog.almena.id}
        NEXT_PUBLIC_REGISTRY_WEB_URL: ${NEXT_PUBLIC_REGISTRY_WEB_URL:-https://registry.almena.id}
    image: almena-catalog:dev
    restart: unless-stopped
    ports:
      - "${CATALOG_WEB_PORT:-3100}:3000"
    environment:
      CATALOG_API_URL: ${CATALOG_API_URL:-https://api.almena.id}
